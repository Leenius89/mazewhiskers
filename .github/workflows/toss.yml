name: Toss bundle

# Builds the Apps in Toss bundle (.ait) on Linux.
#
# Not on a developer's machine, because `ait build` on Windows writes the
# files inside the bundle with backslashes in their paths
# (static\js\main.js) and nothing says Toss's servers will unpick that.
#
#   push to `toss`             build, keep the .ait as a downloadable artifact
#   push a `toss-test-*` tag   the same with the SDK's TEST ads, then upload it
#                              to the console as a test version with a QR
#   push any other `toss-*`    the same with the REAL ad groups (required),
#                              then upload: the bundle to send for review
#
# Two kinds of tag because the ad policy wants both: QR testing must use test
# ad groups (testing with real ones breaks the policy), and review must see
# real ones (test ads fail the checklist).
#
# Uploading is not releasing: a version only reaches players after it has
# been tested, sent for review and approved in the console by hand.
#
# Needs one repository secret, AIT_API_KEY — issued in the console under
# the workspace's "키" menu.

on:
  push:
    branches: [toss]
    tags: ['toss-*']

jobs:
  bundle:
    # Pinned: the bundle's paths and the packer's output are this image's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @apps-in-toss/ait-format declares node >= 24.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build the game and pack it
        env:
          # Ad group IDs from the Toss console (Settings > Secrets and variables
          # > Actions > Variables). Left unset, the build uses the SDK's test
          # ads: right for QR testing, and not something review will pass.
          REACT_APP_AD_INTERSTITIAL: ${{ vars.AD_INTERSTITIAL_ID }}
          REACT_APP_AD_REWARDED: ${{ vars.AD_REWARDED_ID }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/toss-test-* ]]; then
            # A QR test bundle: test ads whatever the Variables say.
            unset REACT_APP_AD_INTERSTITIAL REACT_APP_AD_REWARDED
            echo "QR test bundle: built with the SDK's test ads."
          elif [ -z "$REACT_APP_AD_INTERSTITIAL" ] || [ -z "$REACT_APP_AD_REWARDED" ]; then
            # A release tag uploads for review: test ads there must stop the run.
            if [[ "$GITHUB_REF" == refs/tags/toss-* ]]; then
              echo "::error::Ad group IDs are not set; a release would ship TEST ads. Set AD_INTERSTITIAL_ID and AD_REWARDED_ID in Variables."
              exit 1
            fi
            echo "::warning::Ad group IDs are not set; this bundle shows TEST ads. Fine for QR testing, not for review."
          fi
          npm run build:toss

      - name: What went into the bundle
        run: |
          ls -la *.ait
          unzip -l *.ait | tail -n 40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: mazewhiskers-ait
          path: '*.ait'
          if-no-files-found: error

      - name: Upload to the Toss console
        if: startsWith(github.ref, 'refs/tags/toss-')
        env:
          AIT_API_KEY: ${{ secrets.AIT_API_KEY }}
        run: |
          if [ -z "$AIT_API_KEY" ]; then
            echo "::error::AIT_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx ait deploy --api-key "$AIT_API_KEY" -m "${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
